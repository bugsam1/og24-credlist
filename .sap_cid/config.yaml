stages:
  build:
    buildTool: npm
    buildToolVersion: N20
lifeCycle:
  afterAllStages:
    command: "env | grep -o '^OG24_[A-Z0-9]*_username' | sort"
    credentialVariables:
    - name: OG24_D
      valueSource: og24-f7
    - name: OG24_D
      valueSource: og24-f1
    - name: OG24_E
      valueSource: og24-f1
